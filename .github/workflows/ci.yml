name: CI Monorepo

on:
  push:
    branches: [ main, feature/studioTesting ]
  pull_request:
    branches: [ main, feature/studioTesting ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.16.0

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          echo "⌛ Waiting for MongoDB and NATS to be ready..."
          sleep 10

      - name: Install root dependencies
        working-directory: microservizi
        run: npm install

      - name: Install Inventario dependencies
        run: cd microservizi/magazzino/inventario && npm install

      - name: Install Ordini dependencies
        run: cd microservizi/magazzino/ordini && npm install || echo "No tests for ordini"

      - name: Run all tests
        working-directory: microservizi
        run: npm run test

      - name: Run and merge code coverage
        working-directory: microservizi
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          flags: monorepo

      - name: Update README test table
        working-directory: PoC
        run: node scripts/update-testdata.js


      - name: Commit updated README
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add README.md
          git commit -m "📝 Update README with latest test results" || echo "No changes to commit"
          git push
